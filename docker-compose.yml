version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: boardboard-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"    # опционально — чтобы можно было зайти в /docs напрямую
    volumes:
      # Монтируем код для hot-reload
      - ./backend/app:/code/app
      # Отдельный volume для БД, чтобы данные пережили рестарт контейнера
      - boardboard-db:/code/data
      - ./backend/scripts:/code/scripts
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////code/data/board.db
    networks:
      - boardboard-net

  frontend:
    build:
      context: ./frontend
    container_name: boardboard-frontend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Анонимный volume для node_modules, чтобы не перекрывался хост-папкой
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    networks:
      - boardboard-net

  proxy:
    image: nginx:stable-alpine
    container_name: boardboard-proxy
    restart: unless-stopped
    ports:
      - "3000:80"      # основной вход в приложение
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - boardboard-net

volumes:
  boardboard-db:

networks:
  boardboard-net:
    driver: bridge